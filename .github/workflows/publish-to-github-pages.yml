name: publish-to-github-pages
on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'FirebirdSQL/jaybird-manual'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Build with Gradle
        run: ./gradlew makePages
      - name: Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: pages-artifact
          path: build/pages
          compression-level: 9
          retention-days: 1
  publish-pages:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Get pages artifact
        uses: actions/download-artifact@v8
        with:
          name: pages-artifact
          path: pages
      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445
        with:
          branch: gh-pages
          folder: pages